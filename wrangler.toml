name = "hearth-dash"
main = "oauth-entry.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["global_fetch_strictly_public"]

[vars]
PARTNER_1 = "Partner 1"
PARTNER_2 = "Partner 2"
# WEATHER_LAT = "52.5726"
# WEATHER_LON = "-0.2405"

# Secrets (set via: npx wrangler secret put <NAME>)
# DASHBOARD_PASSWORD
# SESSION_SECRET
# WEATHER_API_KEY

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "YOUR_OAUTH_KV_ID"

[[d1_databases]]
binding = "DB"
database_name = "hearth-dash-db"
database_id = "YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "hearth-dash-photos"
